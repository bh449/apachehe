<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>快速搜索 - InvenTree</title>
<style>
  :root {
    --bg: #f8f9fa;
    --card-bg: #fff;
    --border: #dee2e6;
    --text: #212529;
    --text-dim: #868e96;
    --text-muted: #adb5bd;
    --primary: #228be6;
    --primary-hover: #1c7ed6;
    --danger: #fa5252;
    --warning: #fd7e14;
    --badge-bg: #f1f3f5;
    --radius: 8px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1b1e;
      --card-bg: #25262b;
      --border: #373a40;
      --text: #c1c2c5;
      --text-dim: #909296;
      --text-muted: #5c5f66;
      --badge-bg: #2c2e33;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }

  /* Header bar */
  .header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 10;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header a.back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--primary);
    text-decoration: none;
    font-size: 14px;
    padding: 6px 12px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    transition: background 0.15s;
  }
  .header a.back:hover { background: var(--badge-bg); }
  .header h1 {
    font-size: 18px;
    font-weight: 600;
  }

  /* Main container */
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  /* Search bar */
  .search-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .search-bar input {
    flex: 1;
    padding: 10px 14px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--card-bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .search-bar input:focus { border-color: var(--primary); }
  .search-bar input::placeholder { color: var(--text-muted); }
  .search-bar button {
    padding: 10px 20px;
    border: none;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-primary {
    background: var(--primary);
    color: #fff;
  }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-secondary {
    background: var(--badge-bg);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--border); }

  #status {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 12px;
    min-height: 20px;
  }

  /* Result cards */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 10px;
    transition: box-shadow 0.15s;
  }
  .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .card-title a {
    font-size: 16px;
    font-weight: 600;
    color: var(--primary);
    text-decoration: none;
  }
  .card-title a:hover { text-decoration: underline; }
  .card-ipn {
    font-size: 12px;
    color: var(--text-dim);
    font-family: "SF Mono", "Fira Code", monospace;
    margin-top: 2px;
  }
  .card-desc {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
  }
  .badge-stock {
    color: #fff;
    background: var(--text-dim);
  }
  .badge-low {
    color: #fff;
    background: var(--danger);
  }
  .badge-warn {
    color: var(--danger);
    font-size: 11px;
    font-weight: 600;
  }
  .badge-loc {
    background: var(--badge-bg);
    color: var(--text);
    border: 1px solid var(--border);
    font-size: 11px;
    font-weight: 400;
  }
  .btn-view {
    padding: 6px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    border: 1px solid var(--primary);
    color: var(--primary);
    text-decoration: none;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .btn-view:hover {
    background: var(--primary);
    color: #fff;
  }
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  /* Keyboard hint */
  .hint {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 24px;
  }
  kbd {
    display: inline-block;
    padding: 2px 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 11px;
    background: var(--badge-bg);
    font-family: var(--font);
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <a href="/web" class="back">&larr; InvenTree</a>
    <h1>快速搜索</h1>
  </div>
</div>

<div class="container">
  <div class="search-bar">
    <input type="text" id="searchInput"
      placeholder="输入 IPN、UPC 条码或产品名称..."
      autofocus autocomplete="off" />
    <button class="btn-primary" onclick="doSearch()">搜索</button>
    <button class="btn-secondary" onclick="clearSearch()">清空</button>
  </div>

  <div id="status"></div>
  <div id="results">
    <div class="empty-state">
      <div class="icon">&#128270;</div>
      <p>输入关键词开始搜索</p>
      <p style="margin-top:8px">支持 IPN 编码、UPC 条码、产品名称</p>
    </div>
  </div>
</div>

<div class="hint">
  <kbd>Enter</kbd> 搜索 &nbsp;&middot;&nbsp; <kbd>Esc</kbd> 清空
</div>

<script>
const input = document.getElementById('searchInput');
const resultsDiv = document.getElementById('results');
const statusDiv = document.getElementById('status');
let debounceTimer = null;

// Pre-fill from ?q= URL parameter (Cmd+K spotlight passes query here)
const urlQ = new URLSearchParams(window.location.search).get('q') || '';
if (urlQ) {
  input.value = urlQ;
  setTimeout(() => doSearch(), 100);
}

input.addEventListener('input', function() {
  clearTimeout(debounceTimer);
  if (!this.value.trim()) { clearSearch(); return; }
  debounceTimer = setTimeout(doSearch, 350);
});
input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { clearTimeout(debounceTimer); doSearch(); }
  if (e.key === 'Escape') clearSearch();
});

function getCookie(name) {
  const v = '; ' + document.cookie;
  const p = v.split('; ' + name + '=');
  if (p.length === 2) return p.pop().split(';').shift();
  return '';
}

async function apiGet(url) {
  const r = await fetch(url, {
    headers: { 'Accept': 'application/json', 'X-CSRFToken': getCookie('csrftoken') }
  });
  if (!r.ok) throw new Error('API error ' + r.status);
  return r.json();
}

async function apiPost(url, body) {
  const r = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
    body: JSON.stringify(body)
  });
  return r.json();
}

async function doSearch() {
  const q = input.value.trim();
  if (!q) return;
  statusDiv.textContent = '搜索中...';
  resultsDiv.innerHTML = '';
  let parts = [];

  try {
    // 1. Barcode
    try {
      const bc = await apiPost('/api/barcode/', { barcode: q });
      if (bc.part && bc.part.instance) parts = [bc.part.instance];
    } catch(e) {}

    // 2. Exact IPN
    if (!parts.length) {
      const r = await apiGet('/api/part/?IPN=' + encodeURIComponent(q) + '&limit=1');
      const res = r.results || r;
      if (res.length) parts = res;
    }

    // 3. Name / keyword
    if (!parts.length) {
      const r = await apiGet('/api/part/?search=' + encodeURIComponent(q) + '&limit=20&active=true');
      parts = r.results || r;
    }

    if (!parts.length) {
      statusDiv.textContent = '未找到与 "' + q + '" 相关的产品';
      resultsDiv.innerHTML = '<div class="empty-state"><p>没有匹配结果</p></div>';
      return;
    }

    statusDiv.textContent = '找到 ' + parts.length + ' 个产品';
    renderResults(parts);
  } catch(e) {
    statusDiv.textContent = '搜索出错: ' + e.message;
  }
}

async function renderResults(parts) {
  const html = await Promise.all(parts.map(async (p) => {
    let stockHtml = '';
    try {
      const st = await apiGet('/api/stock/?part=' + p.pk + '&limit=50&location_detail=true');
      const items = st.results || st;
      const byLoc = {};
      items.forEach(s => {
        const k = s.location || 'none';
        const n = s.location_detail ? (s.location_detail.pathstring || s.location_detail.name) : '未分配';
        if (!byLoc[k]) byLoc[k] = { name: n, qty: 0 };
        byLoc[k].qty += parseFloat(s.quantity);
      });
      const total = Object.values(byLoc).reduce((s, v) => s + v.qty, 0);
      const isLow = p.minimum_stock > 0 && total <= p.minimum_stock;
      const locTags = Object.values(byLoc).map(l =>
        '<span class="badge badge-loc">' + l.name.split('/').pop() + ': ' + l.qty + '</span>'
      ).join('');

      stockHtml =
        '<div class="card-meta">' +
        '<span class="badge ' + (isLow ? 'badge-low' : 'badge-stock') + '">' +
          total + ' ' + (p.units || 'pcs') + '</span>' +
        (isLow ? '<span class="badge-warn">⚠ 低于安全库存</span>' : '') +
        locTags +
        '</div>';
    } catch(e) {
      stockHtml = '<div style="font-size:12px;color:var(--text-dim);margin-top:8px">库存查询失败</div>';
    }

    return '<div class="card">' +
      '<div class="card-top">' +
        '<div>' +
          '<div class="card-title"><a href="/web/part/' + p.pk + '">' + p.name + '</a></div>' +
          '<div class="card-ipn">' + (p.IPN || '—') + '</div>' +
          (p.description ? '<div class="card-desc">' + p.description + '</div>' : '') +
        '</div>' +
        '<a href="/web/part/' + p.pk + '" class="btn-view">查看详情</a>' +
      '</div>' +
      stockHtml +
    '</div>';
  }));

  resultsDiv.innerHTML = html.join('');
}

function clearSearch() {
  input.value = '';
  statusDiv.textContent = '';
  resultsDiv.innerHTML =
    '<div class="empty-state"><div class="icon">&#128270;</div>' +
    '<p>输入关键词开始搜索</p>' +
    '<p style="margin-top:8px">支持 IPN 编码、UPC 条码、产品名称</p></div>';
  input.focus();
}
</script>
</body>
</html>
