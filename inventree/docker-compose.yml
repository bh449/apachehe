version: "3.8"

# Mini ERP + WMS based on InvenTree
# Usage:
#   cp .env.example .env   (then edit .env)
#   docker compose up -d
#   Open http://localhost:1880

services:
  # --- Database ---
  inventree-db:
    image: postgres:17
    container_name: inventree-db
    restart: unless-stopped
    expose:
      - ${INVENTREE_DB_PORT:-5432}/tcp
    environment:
      PGDATA: /var/lib/postgresql/data/pgdb
      POSTGRES_USER: ${INVENTREE_DB_USER:-pguser}
      POSTGRES_PASSWORD: ${INVENTREE_DB_PASSWORD:-pgpassword}
      POSTGRES_DB: ${INVENTREE_DB_NAME:-inventree}
    volumes:
      - inventree-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INVENTREE_DB_USER:-pguser} -d ${INVENTREE_DB_NAME:-inventree}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Cache ---
  inventree-cache:
    image: redis:7-alpine
    container_name: inventree-cache
    restart: unless-stopped
    expose:
      - ${INVENTREE_CACHE_PORT:-6379}/tcp
    volumes:
      - inventree-cache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- InvenTree Web Server ---
  inventree-server:
    image: inventree/inventree:${INVENTREE_TAG:-stable}
    container_name: inventree-server
    restart: unless-stopped
    depends_on:
      inventree-db:
        condition: service_healthy
      inventree-cache:
        condition: service_healthy
    expose:
      - ${INVENTREE_WEB_PORT:-8000}
    volumes:
      - inventree-data:/home/inventree/data
    env_file:
      - .env

  # --- Background Worker ---
  inventree-worker:
    image: inventree/inventree:${INVENTREE_TAG:-stable}
    container_name: inventree-worker
    restart: unless-stopped
    command: invoke worker
    depends_on:
      inventree-server:
        condition: service_started
    volumes:
      - inventree-data:/home/inventree/data
    env_file:
      - .env

  # --- Reverse Proxy ---
  inventree-proxy:
    image: caddy:alpine
    container_name: inventree-proxy
    restart: unless-stopped
    depends_on:
      inventree-server:
        condition: service_started
    ports:
      - ${INVENTREE_HTTP_PORT:-1880}:80
      - ${INVENTREE_HTTPS_PORT:-1443}:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - inventree-data:/var/www
      - caddy-data:/data
      - caddy-config:/config

volumes:
  inventree-db-data:
  inventree-cache-data:
  inventree-data:
  caddy-data:
  caddy-config:
